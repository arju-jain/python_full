{% extends 'base.html' %}

{% block content %}
<div class="container py-5 my-lg-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card p-4 p-md-5 border shadow-sm bg-white text-center" style="border-radius: var(--aura-radius-lg);">
        <div class="mb-3 mx-auto rounded-circle bg-danger text-white d-flex align-items-center justify-content-center" style="width: 72px; height: 72px;">
          <i class="bi bi-x-octagon fs-1"></i>
        </div>
        <h3 class="mb-2">Payment Verification Failed</h3>
        <p class="text-muted small mb-3">The transaction for Order <strong>#{{ order.order_number }}</strong> could not be authenticated by the gateway.</p>
        <p class="small text-muted mb-4">No funds have been debited. You may retry payment or select another card.</p>
        <div class="d-flex flex-column gap-2">
          <a href="{% url 'payments:initiate' order_number=order.order_number %}" class="btn btn-aura">Retry Payment</a>
          <a href="{% url 'core:contact' %}" class="btn btn-aura-outline">Contact Concierge</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
